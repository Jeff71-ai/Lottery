<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    --text-primary: #ffffff;
    --text-secondary: rgba(255, 255, 255, 0.75);
    --text-muted: rgba(255, 255, 255, 0.45);
    --card-bg: rgba(255, 255, 255, 0.07);
    --card-border: rgba(255, 255, 255, 0.14);
    --input-bg: rgba(255, 255, 255, 0.09);

  }

  html, body {
    height: 100%;
    overflow: hidden;
  }

  body {

    background: linear-gradient(160deg, var(--bg-primary) 0%, var(--bg-secondary) 55%, var(--bg-tertiary) 100%);
    color: var(--text-primary);
    position: relative;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }

  /* 背景装饰 */
  body::before {
    content: '';

    top: -50%;

  }

  @keyframes bgPulse {

  .draw-stage {

  }

  /* 滚动视窗 */
  .viewport {
    width: 100%;
    height: 160px;
    background: linear-gradient(180deg, 
      rgba(0, 0, 0, 0.4) 0%, 
      rgba(255, 215, 0, 0.06) 50%, 
      rgba(0, 0, 0, 0.4) 100%);
    border: 2px solid rgba(255, 215, 0, 0.32);
    border-radius: var(--radius-md);
    position: relative;
    overflow: hidden;
    margin-bottom: 20px;
    box-shadow: 
      inset 0 0 50px rgba(0, 0, 0, 0.5),
      0 0 25px rgba(255, 215, 0, 0.1);
  }

  .viewport::before,
  .viewport::after {
    content: '';
    position: absolute;
    left: 0;
    right: 0;
    height: 45px;
    pointer-events: none;
    z-index: 2;
  }

  .viewport::before {
    top: 0;
    background: linear-gradient(180deg, rgba(15, 12, 41, 0.92) 0%, transparent 100%);

  .viewport::after {
    bottom: 0;
    background: linear-gradient(0deg, rgba(15, 12, 41, 0.92) 0%, transparent 100%);
  }

  /* 中间指示线 */
  .viewport .indicator {
    position: absolute;
    top: 50%;
    left: 12px;
    right: 12px;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);

    z-index: 3;
    opacity: 0.85;
    box-shadow: 0 0 12px var(--gold);
  }

  /* 滚动列表 */
  .name-scroll {
    position: absolute;
    top: 50%;
    left: 0;
    right: 0;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    will-change: transform;
  }

  .name-item {
    height: 52px;
    line-height: 52px;
    font-size: 1.5rem;
    font-weight: 600;
    color: var(--text-secondary);
    padding: 0 16px;
    white-space: nowrap;
    transition: all 0.15s ease;
  }

  .name-item.active {
    color: var(--gold-light);
    text-shadow: 0 0 18px rgba(255, 215, 0, 0.8), 0 0 36px rgba(255, 215, 0, 0.4);
    font-size: 1.85rem;
    font-weight: 700;
  }

  .name-item.winner {
    color: var(--gold-light);

    animation: winnerPulse 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  @keyframes winnerPulse {
    0% { transform: scale(0.7); opacity: 0; }
    60% { transform: scale(1.15); }
    100% { transform: scale(1); opacity: 1; }
  }

  /* 空状态 */
  .empty-state {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: var(--text-muted);
    font-size: 1rem;
    text-align: center;
    z-index: 1;
    width: 100%;

  /* 控制按钮 - 移动端大按钮 */
  .controls {
    display: flex;

    justify-content: center;
  }

  .btn {
    padding: 16px 0;

  }

  }

  .tab-btn .tab-icon {
    width: 16px;
    height: 16px;
  }

  .tab-content {
    display: none;
  }

  .tab-content.active {
    display: block;
  }

  /* 面板 */
  .panel {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: var(--radius-lg);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);

    margin-bottom: 12px;
  }

  .panel-title {
    font-size: 1rem;

  .panel-title .icon {
    width: 18px;

  }

  .panel-title .count {
    margin-left: auto;

  }

  .input-group {
    display: flex;

  }

    flex: 1;

  }

  .btn-add {

    background: rgba(255, 255, 255, 0.08);
  }

  .name-chip .name-text {
    font-size: 0.95rem;
    color: var(--text-primary);
  }

  .name-chip .btn-remove {
    width: 26px;
    height: 26px;
    border: none;
    background: rgba(255, 107, 107, 0.18);
    color: var(--accent);
    border-radius: 50%;
    cursor: pointer;
    font-size: 1.1rem;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
  }

  .name-chip .btn-remove:active {
    transform: scale(0.9);
    background: rgba(255, 107, 107, 0.3);
  }

    border-radius: var(--radius-sm);

  .btn-sm:active {

  }

  .btn-sm.danger {
    color: var(--accent);
    border-color: rgba(255, 107, 107, 0.3);
  }

  /* 中奖记录 */
  .winner-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    max-height: 280px;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }

  .winner-list::-webkit-scrollbar {
    width: 4px;
  }

  .winner-list::-webkit-scrollbar-thumb {
    background: rgba(255, 215, 0, 0.3);
    border-radius: 2px;
  }

  .winner-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    background: rgba(255, 215, 0, 0.06);
    border-radius: var(--radius-sm);
    border-left: 3px solid var(--gold);
  }

  .winner-item .rank {
    font-size: 0.85rem;
    color: var(--gold);
    font-weight: 600;
    min-width: 24px;
  }

  .winner-item .winner-name {
    flex: 1;
    font-size: 0.95rem;
    color: var(--text-primary);
  }

  /* 彩带效果 */
  .confetti-container {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 100;
    overflow: hidden;
  }

  .confetti {
    position: absolute;
    width: 10px;
    height: 10px;
    opacity: 0;
    animation: confettiFall 3s ease-out forwards;
  }

  @keyframes confettiFall {
    0% {
      opacity: 1;
      transform: translateY(-100px) rotate(0deg);
    }
    100% {
      opacity: 0;
      transform: translateY(100vh) rotate(720deg);
    }
  }

  /* 底部提示 */
  .footer-tip {
    text-align: center;
    color: var(--text-muted);
    font-size: 0.78rem;
    padding: 8px 0 4px;
  }

  /* 安装提示横幅 */
  .install-banner {
    position: fixed;
    bottom: calc(16px + var(--safe-bottom));
    left: 16px;
    right: 16px;
    background: linear-gradient(135deg, rgba(255, 215, 0, 0.15) 0%, rgba(255, 107, 107, 0.1) 100%);
    border: 1px solid rgba(255, 215, 0, 0.3);
    border-radius: var(--radius-md);
    padding: 14px 16px;
    z-index: 50;
    display: none;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    animation: slideUp 0.3s ease-out;
  }

  @keyframes slideUp {
    from { transform: translateY(100%); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }

  .install-banner.show {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .install-banner .banner-icon {
    width: 36px;
    height: 36px;
    flex-shrink: 0;
  }

  .install-banner .banner-text {
    flex: 1;
    font-size: 0.85rem;
    color: var(--text-primary);
    line-height: 1.4;
  }

  .install-banner .banner-text span {
    color: var(--gold);
    font-weight: 600;
  }

  .install-banner .banner-close {
    width: 28px;
    height: 28px;
    border: none;
    background: rgba(255, 255, 255, 0.1);
    color: var(--text-secondary);
    border-radius: 50%;
    cursor: pointer;
    font-size: 1rem;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  /* 横屏适配 */
  @media (orientation: landscape) and (max-height: 500px) {
    .header { padding: 8px 20px 4px; }
    .header h1 { font-size: 1.3rem; }
    .header p { display: none; }
    .draw-stage { padding: 16px 20px 14px; margin-bottom: 10px; }
    .viewport { height: 110px; margin-bottom: 12px; }
    .name-item { height: 40px; line-height: 40px; font-size: 1.2rem; }
    .name-item.active { font-size: 1.4rem; }
    .name-item.winner { font-size: 1.6rem; }
    .btn { padding: 10px 0; font-size: 0.95rem; }
  }
</style>

<body>
  <div class="app">
    <header class="header">
      <h1>幸运抽奖</h1>
      <p>LUCKY DRAW</p>
    </header>

    <div class="main-scroll">
      <!-- 抽奖展示区 -->
      <div class="draw-stage">
        <div class="viewport" id="viewport">
          <div class="indicator"></div>
          <div class="name-scroll" id="nameScroll"></div>
          <div class="empty-state" id="emptyState">
            请先添加参与人员
          </div>
        </div>

        <div class="controls">
          <button class="btn btn-start" id="startBtn">
            开始抽奖
          </button>
          <button class="btn btn-stop" id="stopBtn" disabled>
            停 止
          </button>
        </div>
      </div>

      <!-- Tab 切换 -->
      <div class="tabs">
        <button class="tab-btn active" data-tab="names">
          <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
            <circle cx="9" cy="7" r="4"></circle>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
          </svg>
          参与人员
        </button>
        <button class="tab-btn" data-tab="winners">
          <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
          </svg>
          中奖记录
        </button>
      </div>

      <!-- 参与人员 Tab -->
      <div class="tab-content active" id="tab-names">
        <div class="panel">
          <div class="panel-title">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 5v14M5 12h14"></path>
            </svg>
            添加人员
            <span class="count" id="nameCount">0 人</span>
          </div>

          <div class="input-group">
            <input type="text" id="nameInput" placeholder="输入姓名，按回车添加">
            <button class="btn-add" id="addBtn">添加</button>
          </div>
          <div class="batch-hint">
            批量添加：用 <kbd>空格</kbd> 或 <kbd>逗号</kbd> 分隔
          </div>

          <div class="name-list" id="nameList">
            <div class="list-empty">暂无参与人员</div>
          </div>

          <div class="batch-actions">
            <button class="btn-sm" id="sampleBtn">示例名单</button>
            <button class="btn-sm danger" id="clearBtn">清空名单</button>
          </div>
        </div>
      </div>

      <!-- 中奖记录 Tab -->
      <div class="tab-content" id="tab-winners">
        <div class="panel">
          <div class="panel-title">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
            </svg>
            中奖记录
            <span class="count" id="winnerCount">0 位</span>
          </div>
          <div class="winner-list" id="winnerList">
            <div class="list-empty">暂无中奖者</div>
          </div>
        </div>
      </div>

      <div class="footer-tip">
        点击按钮或轻触屏幕开始/停止抽奖
      </div>
    </div>
  </div>

  <!-- 安装提示 -->
  <div class="install-banner" id="installBanner">
    <svg class="banner-icon" viewBox="0 0 24 24" fill="none" stroke="#ffd700" stroke-width="2">
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
      <polyline points="7 10 12 15 17 10"></polyline>
      <line x1="12" y1="15" x2="12" y2="3"></line>
    </svg>
    <div class="banner-text">
      点击浏览器菜单，选择<span>"添加到主屏幕"</span>，像 App 一样使用
    </div>
    <button class="banner-close" id="bannerClose">×</button>
  </div>

  <div class="confetti-container" id="confettiContainer"></div>

<script>
  // ============ 状态 ============
  let names = [];
  let winners = [];
  let isRolling = false;
  let rollInterval = null;
  let rollSpeed = 50;
  let currentOffset = 0;
  const ITEM_HEIGHT = 52;
  let deferredPrompt = null;

  // ============ DOM ============
  const $ = id => document.getElementById(id);
  const nameInput = $('nameInput');
  const nameList = $('nameList');
  const nameCount = $('nameCount');
  const nameScroll = $('nameScroll');
  const emptyState = $('emptyState');
  const startBtn = $('startBtn');
  const stopBtn = $('stopBtn');
  const winnerList = $('winnerList');
  const winnerCount = $('winnerCount');
  const viewport = $('viewport');
  const confettiContainer = $('confettiContainer');
  const addBtn = $('addBtn');
  const sampleBtn = $('sampleBtn');
  const clearBtn = $('clearBtn');
  const installBanner = $('installBanner');
  const bannerClose = $('bannerClose');

  // ============ 本地存储 ============
  const STORAGE_KEY = 'lottery_app_data';
  function saveData() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ names, winners }));
    } catch (e) {}
  }
  function loadData() {
    try {
      const data = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
      if (Array.isArray(data.names)) names = data.names;
      if (Array.isArray(data.winners)) winners = data.winners;
    } catch (e) {}
  }

  // ============ 滚动控制 ============
  function setScrollPosition(offset) {
    currentOffset = offset;
    nameScroll.style.transform = `translateY(calc(-50% + ${offset}px))`;
    updateActiveItem();
  }

  function initScrollList() {
    if (names.length === 0) {
      nameScroll.innerHTML = '';
      emptyState.style.display = 'block';
      return;
    }
    emptyState.style.display = 'none';
    
    const repeatCount = 5;
    const displayCount = names.length * repeatCount;
    let html = '';
    for (let i = 0; i < displayCount; i++) {
      const nameIndex = i % names.length;
      html += `<div class="name-item" data-name-idx="${nameIndex}">${escapeHtml(names[nameIndex])}</div>`;
    }
    nameScroll.innerHTML = html;
    setScrollPosition(0);
  }

  function updateActiveItem() {
    const items = nameScroll.querySelectorAll('.name-item');
    if (items.length === 0) return;
    
    const totalItems = items.length;
    const midIdx = Math.floor(totalItems / 2);
    const offsetItems = -currentOffset / ITEM_HEIGHT;
    const centerItemIdx = Math.round(midIdx + offsetItems);
    
    items.forEach(item => item.classList.remove('active'));
    
    if (centerItemIdx >= 0 && centerItemIdx < totalItems) {
      items[centerItemIdx].classList.add('active');
    }
  }

  // ============ 名单管理 ============
  function addName() {
    const input = nameInput.value.trim();
    if (!input) return;

    const newNames = input
      .split(/[\s,，、\n]+/)
      .map(n => n.trim())
      .filter(n => n.length > 0 && !names.includes(n));

    if (newNames.length === 0) {
      nameInput.value = '';
      nameInput.focus();
      return;
    }

    names.push(...newNames);
    nameInput.value = '';
    nameInput.focus();
    renderNameList();
    initScrollList();
    saveData();
    
    // 震动反馈
    if (navigator.vibrate) navigator.vibrate(10);
  }

  function removeName(index) {
    if (isRolling) return;
    names.splice(index, 1);
    renderNameList();
    initScrollList();
    saveData();
  }

  function clearAllNames() {
    if (isRolling) return;
    if (names.length === 0) return;
    if (confirm('确定要清空所有参与人员吗？')) {
      names = [];
      renderNameList();
      initScrollList();
      saveData();
    }
  }

  function addSampleNames() {
    if (isRolling) return;
    const samples = [
      '张三', '李四', '王五', '赵六', '钱七',
      '孙八', '周九', '吴十', '郑一', '冯二',
      '陈小明', '林小红', '黄小华', '刘小强', '杨小丽'
    ];
    const newSamples = samples.filter(n => !names.includes(n));
    names.push(...newSamples);
    renderNameList();
    initScrollList();
    saveData();
  }

  function renderNameList() {
    nameCount.textContent = `${names.length} 人`;
    
    if (names.length === 0) {
      nameList.innerHTML = '<div class="list-empty">暂无参与人员</div>';
      startBtn.disabled = true;
      return;
    }

    startBtn.disabled = isRolling;
    nameList.innerHTML = names.map((name, i) => `
      <div class="name-chip">
        <span class="name-text">${escapeHtml(name)}</span>
        <button class="btn-remove" data-remove="${i}">×</button>
      </div>
    `).join('');
  }

  function renderWinnerList() {
    winnerCount.textContent = `${winners.length} 位`;
    
    if (winners.length === 0) {
      winnerList.innerHTML = '<div class="list-empty">暂无中奖者</div>';
      return;
    }

    winnerList.innerHTML = winners.map((winner, i) => `
      <div class="winner-item">
        <span class="rank">${i + 1}</span>
        <span class="winner-name">${escapeHtml(winner)}</span>
      </div>
    `).join('');
  }

  // ============ 抽奖逻辑 ============
  function startDraw() {
    if (isRolling || names.length === 0) return;
    
    isRolling = true;
    startBtn.disabled = true;
    stopBtn.disabled = false;
    nameInput.disabled = true;
    
    const items = nameScroll.querySelectorAll('.name-item');
    items.forEach(item => item.classList.remove('winner'));
    
    const cycleHeight = names.length * ITEM_HEIGHT;
    const lowerBound = -cycleHeight * 2;
    
    rollInterval = setInterval(() => {
      let newOffset = currentOffset - ITEM_HEIGHT;
      if (newOffset <= lowerBound) {
        newOffset += cycleHeight;
      }
      setScrollPosition(newOffset);
    }, rollSpeed);
    
    if (navigator.vibrate) navigator.vibrate(15);
  }

  function stopDraw() {
    if (!isRolling) return;
    
    clearInterval(rollInterval);
    
    const items = nameScroll.querySelectorAll('.name-item');
    const totalItems = items.length;
    const midIdx = Math.floor(totalItems / 2);
    const N = names.length;
    
    const offsetItems = -currentOffset / ITEM_HEIGHT;
    const currentCenterIdx = midIdx + offsetItems;
    
    const winnerNameIdx = Math.floor(Math.random() * N);
    const winnerName = names[winnerNameIdx];
    
    const extraCycles = 0.8 + Math.random() * 1.0;
    const extraItems = Math.floor(extraCycles * N);
    
    let targetIdx = Math.floor(currentCenterIdx) + extraItems;
    const currentNameIdx = ((targetIdx % N) + N) % N;
    const adjust = ((winnerNameIdx - currentNameIdx) + N) % N;
    targetIdx += adjust;
    
    if (targetIdx >= totalItems - 3) {
      targetIdx -= N;
    }
    
    const targetOffset = -(targetIdx - midIdx) * ITEM_HEIGHT;
    
    const startOffset = currentOffset;
    const distance = targetOffset - startOffset;
    const duration = 1800 + Math.random() * 400;
    const startTime = Date.now();
    
    function easeOutCubic(t) {
      return 1 - Math.pow(1 - t, 3);
    }
    
    function animate() {
      const elapsed = Date.now() - startTime;
      const progress = Math.min(elapsed / duration, 1);
      const eased = easeOutCubic(progress);
      
      const newOffset = startOffset + distance * eased;
      setScrollPosition(newOffset);
      
      if (progress < 1) {
        requestAnimationFrame(animate);
      } else {
        isRolling = false;
        stopBtn.disabled = true;
        startBtn.disabled = false;
        nameInput.disabled = false;
        
        setScrollPosition(targetOffset);
        
        const activeItem = nameScroll.querySelector('.name-item.active');
        if (activeItem) {
          activeItem.classList.remove('active');
          activeItem.classList.add('winner');
        }
        
        winners.unshift(winnerName);
        renderWinnerList();
        saveData();
        createConfetti();
        
        if (navigator.vibrate) navigator.vibrate([50, 30, 50, 30, 100]);
      }
    }
    
    animate();
  }

  // ============ 彩带动效 ============
  function createConfetti() {
    const colors = ['#ffd700', '#ff6b6b', '#4ecdc4', '#a855f7', '#38ef7d', '#ff9f43'];
    const count = 60;
    
    for (let i = 0; i < count; i++) {
      const confetti = document.createElement('div');
      confetti.className = 'confetti';
      confetti.style.left = Math.random() * 100 + '%';
      confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
      confetti.style.width = (Math.random() * 7 + 5) + 'px';
      confetti.style.height = (Math.random() * 7 + 5) + 'px';
      confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
      confetti.style.animationDelay = Math.random() * 0.4 + 's';
      confetti.style.animationDuration = (Math.random() * 1.5 + 2) + 's';
      confettiContainer.appendChild(confetti);
      
      setTimeout(() => confetti.remove(), 4000);
    }
  }

  // ============ Tab 切换 ============
  function switchTab(tabName) {
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.tab === tabName);
    });
    document.querySelectorAll('.tab-content').forEach(content => {
      content.classList.toggle('active', content.id === 'tab-' + tabName);
    });
  }

  // ============ 工具函数 ============
  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  // ============ 事件绑定 ============
  function bindEvents() {
    // 按钮
    startBtn.addEventListener('click', startDraw);
    stopBtn.addEventListener('click', stopDraw);
    addBtn.addEventListener('click', addName);
    sampleBtn.addEventListener('click', addSampleNames);
    clearBtn.addEventListener('click', clearAllNames);
    
    // 回车添加
    nameInput.addEventListener('keypress', e => {
      if (e.key === 'Enter') addName();
    });
    
    // 删除按钮（事件委托）
    nameList.addEventListener('click', e => {
      const btn = e.target.closest('[data-remove]');
      if (btn) {
        const idx = parseInt(btn.dataset.remove);
        removeName(idx);
      }
    });
    
    // Tab 切换
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => switchTab(btn.dataset.tab));
    });
    
    // 视窗点击也能开始/停止
    viewport.addEventListener('click', () => {
      if (names.length === 0) return;
      if (isRolling) stopDraw();
      else startDraw();
    });
    
    // 安装横幅关闭
    bannerClose.addEventListener('click', () => {
      installBanner.classList.remove('show');
    });
    
    // PWA 安装提示
    window.addEventListener('beforeinstallprompt', e => {
      e.preventDefault();
      deferredPrompt = e;
      // 显示安装提示（延迟一下避免突兀）
      setTimeout(() => {
        installBanner.classList.add('show');
      }, 2000);
    });
    
    // 已安装则隐藏横幅
    if (window.matchMedia('(display-mode: standalone)').matches) {
      installBanner.style.display = 'none';
    }
  }

  // ============ PWA Service Worker 注册 ============
  function registerSW() {
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }
  }

  // ============ 初始化 ============
  function init() {
    loadData();
    renderNameList();
    renderWinnerList();
    initScrollList();
    bindEvents();
    registerSW();
  }

  init();
</script>
</body>
</html>
